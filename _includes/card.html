<style>
.responsive-card {
  display: flex;
  border: 1px solid #ddd;
  border-radius: 6px;
  overflow: hidden;
  margin: 1rem 0;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  flex-direction: row;
}

.card-image {
  flex: 1 1 40%;
  position: relative;
}

.card-image img {
  width: 100%;
  height: 100%;
  max-height: 300px;
  object-fit: cover;
  display: block;
}

.card-content {
  flex: 1 1 60%;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-content h3 {
  margin-top: 0;
}

.card-content p {
  margin-bottom: 1rem;
}

.card-content .btn {
  align-self: flex-start;
  padding: 0.5rem 1rem;
  background: #007acc;
  color: #fff;
  text-decoration: none;
  border-radius: 4px;
}

.card-content .btn:hover {
  background: #005f99;
}

/* Responsive layout */
@media (max-width: 768px) {
  .responsive-card {
    flex-direction: column;
  }

  .card-image {
    width: 100%;
    height: auto;
  }

  .card-image img {
    width: 100%;
    height: auto;
  }

  .card-content {
    padding: 1rem;
  }
}

</style>
<div class="responsive-card">
  <div class="card-image">
    <img src="{{ include.image }}" alt="{{ include.title }}">
  </div>
  <div class="card-content">
    <h3>{{ include.title }}</h3>
    <p>{{ include.content | markdownify }}</p>
    {% if include.link %}
      <a href="{{ include.link }}" class="btn">Ver más</a>
    {% endif %}
  </div>
</div>

<style>
.note-card{
  width: 100%;
  max-width: 850px;
  background: var(--card, transparent);
  border: 1px solid var(--border-color, #777bb3);
  border-radius: 20px;
  box-shadow: 0 6px 18px rgba(0,0,0,.08);
  padding: 1.5rem;
  margin: 2rem auto;
}

.card-header{
  display: grid;
  grid-template-columns: 72px 1fr auto;
  gap: 1rem;
  align-items: center;
  margin-bottom: 1rem;
}

.avatar{
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  overflow: hidden;
  border: 2px solid var(--accent, #777bb3);
}

.author h1{
  margin: 0;
  font-size: 1.4rem;
  line-height: 1.2;
}

.subtitle{
  margin: .25rem 0 0;
  color: var(--muted, #666);
  font-size: .9rem;
}

.chip{
  border: 1px solid var(--accent, #777bb3);
  color: var(--accent, #777bb3);
  padding: .25rem .6rem;
  border-radius: 999px;
  font-weight: 600;
  font-size: .75rem;
}

.quote{
  position: relative;
  margin: 1rem 0;
  padding-left: 1.5rem;
  font-size: 1rem;
  line-height: 1.6;
}

.quote::before{
  content: "“";
  position: absolute;
  left: 0;
  top: -8px;
  font-size: 2.5rem;
  opacity: .3;
  color: var(--accent, #777bb3);
}

.card-footer{
  display: flex;
  justify-content: space-between;
  margin-top: 1rem;
  padding-top: .75rem;
  padding-bottom: 0;
  border-top: 1px solid var(--stroke, #ccc);
}

.credit{
  color: var(--muted, #666);
  font-weight: 600;
}

.when{
  color: var(--muted, #666);
  font-size: .85rem;
}

/* Responsivo */
@media (max-width: 520px){
  .card-header{
    grid-template-columns: 56px 1fr auto;
  }
  .avatar{ width: 56px; height: 56px; }
}

</style>
<article class="note-card" role="article" aria-labelledby="title">
  <header class="card-header">
    <!-- Aquí puedes pasar la URL de la imagen desde el include -->
    <img
      class="avatar"
      src="{{ include.image }}"
      alt="Foto de {{ include.author }}"
      loading="lazy"
    />
    <div class="author">
      <h1 id="title">{{ include.author }}</h1>
      <p class="subtitle">{{ include.subtitle }}</p>
    </div>
    <span class="chip">{{ include.tag }}</span>
  </header>

  <blockquote class="quote">
    {{ include.text | markdownify }}
  </blockquote>

  <div class="card-footer">
    <span class="credit">— {{ include.author }}</span>
    <time class="when">{{ include.date }}</time>
  </div>
</article>
